# Manual: downloads the five public TCIA patients (~0.6 GB, CC BY 4.0), runs the real-data tests and
# the real-data experiments, and prints the result tables to the job summary.
#
# It deliberately uploads NO artifacts: figures made from real image data (geometry.png) must not be
# published, and artifacts of a public repository are downloadable by anyone.
name: real-data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[registration,app,dev]"
      - name: Download public TCIA data
        run: |
          python scripts/download_tcia.py Vestibular-Schwannoma-SEG data/raw/vs-seg \
            VS-SEG-135 VS-SEG-154 VS-SEG-188 --yes --min-free-gb 1
          python scripts/download_tcia.py Pancreatic-CT-CBCT-SEG data/raw/pancreas-ct-cbct-seg \
            Pancreas-CT-CB_014 Pancreas-CT-CB_017 --yes --min-free-gb 1
      - name: Real-data tests
        run: pytest -ra tests/test_real_data.py
      - name: Run real-data experiments
        run: |
          for c in experiments/real/*.yaml; do
            doseshift run "$c" --out "outputs/real/$(basename "$c" .yaml)"
          done
      - name: Result tables to job summary (numbers only)
        run: |
          {
            echo "## Grid audit (equivalent rigid shift, mm)"
            for d in outputs/real/*_audit; do
              echo "### $(basename "$d")"; echo '```'
              python -c "import pandas as pd,sys; df=pd.read_csv(sys.argv[1]); print(df.sort_values('equivalent_shift_mm',ascending=False).head(6).round(2).to_string(index=False))" "$d/audit_equivalence.csv"
              echo '```'
            done
            echo "## Contour variation"
            for d in outputs/real/*_contours; do
              echo "### $(basename "$d")"; echo '```'
              python -c "import pandas as pd,sys; df=pd.read_csv(sys.argv[1]); print(df[df.metric=='D2%'][['alternative','structure','dice','volume_ratio','rigid_comparable','delta','equivalent_shift_mm']].round(2).to_string(index=False))" "$d/contour_variation.csv"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
